name: Build README

on:
  push:
    branches:
      - main
    paths:
      - "**/build.json"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.ACTION_DEPLOY_KEY }}

      - name: Generate README files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          find . -type f -name "build.json" | while read config_file; do
            dir=$(dirname "$config_file")
          
            soal_md=$(jq -r '.soal_md' "$config_file")
            readme="${dir}/README.md"
            soal="${dir}/SOAL.md"

            if [ "$soal_md" = "true" ] && [ ! -f "$soal" ] && [ -f "$readme" ]; then
              cp "$readme" "$soal"
            fi

            tmp="$(mktemp)"

            jq -r '.build[]' "$config_file" | while read md_file; do
              target_file="${dir}/${md_file}"
              if [ -f "$target_file" ]; then
                cat "$target_file" >> "$tmp"
                printf '\n' >> "$tmp"
              fi
            done

            mv "$tmp" "$readme"
          done

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add "**/README.md" "**/SOAL.md"
          
          if git diff --cached --quiet; then
            exit 0
          fi
          
          git commit -m "build: generate task README files"
          git push origin main